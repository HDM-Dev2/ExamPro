  </defs>

  <rect width="200" height="200" rx="40" fill="url(#bgGradient)" />

  <g transform="translate(100, 100)">
    <rect x="-65" y="-70" width="130" height="140" rx="15" fill="none" stroke="url(#iconGradient)" stroke-width="5" />

    <rect x="-50" y="-55" width="100" height="25" rx="5" fill="url(#iconGradient)" opacity="0.9" />
    <rect x="-50" y="-15" width="100" height="25" rx="5" fill="url(#iconGradient)" opacity="0.7" />
    <rect x="-50" y="25" width="100" height="25" rx="5" fill="url(#iconGradient)" opacity="0.5" />

    <polygon points="-35,-75 -25,-90 -15,-75 -25,-60" fill="url(#iconGradient)" />

    <circle cx="0" cy="70" r="12" fill="#60a5fa" stroke="#ffffff" stroke-width="2" />
    <circle cx="-25" cy="70" r="6" fill="#93c5fd" opacity="0.7" />
    <circle cx="25" cy="70" r="6" fill="#93c5fd" opacity="0.7" />
  </g>
</svg>